    <main>

                    <iframe src="" title="Știre" allowfullscreen></iframe>
                    <h3 class="stire-dialog-titlu"></h3>
                    <p class="stire-data stire-dialog-data"></p>
                    <p class="lectie-feedback">Ți-a plăcut?
                        <a class="stire-dialog-link" href="" target="_blank" rel="noopener noreferrer">Vezi tot pe

                    <form method="dialog"><button class="btn btn-amber">Închide</button></form>
                </dialog>

            </div>

    <!-- Întâi lista de știri-->
    <script src="data/stiri-data.js"></script>
    <script src="main.js"></script>
    <script>
        // Oprește videoclipul când se închide dialogul
        document.querySelectorAll('dialog').forEach(function (dialog) {
            dialog.addEventListener('close', function () {
                var iframe = dialog.querySelector('iframe');
                if (iframe) {
                    var src = iframe.src;
                    iframe.src = '';
                    iframe.src = src;
                }
            });
        });
    </script>
